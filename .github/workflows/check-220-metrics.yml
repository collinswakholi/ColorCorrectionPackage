name: Diagnose Python 3.9 fit equivalence
on:
  push:
    branches: [codex/check-220-metrics]
permissions:
  contents: read
jobs:
  repeat:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.9'}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[performance]'
      - name: Compare fits and print any differing metrics and pixels
        run: |
          for i in {1..12}; do
            python -I scripts/verify_grouped_config.py --photos --output "$RUNNER_TEMP/group-$i.json" || exit 1
          done
