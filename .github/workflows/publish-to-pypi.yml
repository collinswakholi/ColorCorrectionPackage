name: Publish to PyPI

on:
  push:
    paths:
      - 'pyproject.toml'
      - 'ColorCorrectionPipeline/__version__.py'
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'ColorCorrectionPipeline/__version__.py'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine hatchling
    
    - name: Extract version
      id: get_version
      run: |
        VERSION=$(python -c "exec(open('ColorCorrectionPipeline/__version__.py').read()); print(__version__)")
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Package version: $VERSION"
    
    - name: Check if version exists on PyPI
      id: check_pypi
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        echo "Checking if version $VERSION exists on PyPI..."
        if pip index versions ColorCorrectionPipeline 2>/dev/null | grep -q "$VERSION"; then
          echo "VERSION_EXISTS=true" >> $GITHUB_OUTPUT
          echo "⚠️  Version $VERSION already exists on PyPI"
        else
          echo "VERSION_EXISTS=false" >> $GITHUB_OUTPUT
          echo "✅ Version $VERSION is new, proceeding with build"
        fi
      continue-on-error: true
    
    - name: Build package
      run: |
        echo "🔨 Building package..."
        python -m build
        echo "📦 Build artifacts:"
        ls -lh dist/
    
    - name: Validate distribution
      run: |
        echo "✅ Validating distribution with twine..."
        twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-packages-${{ steps.get_version.outputs.VERSION }}
        path: dist/
        retention-days: 30
    
    - name: Publish to PyPI
      if: |
        steps.check_pypi.outputs.VERSION_EXISTS != 'true' && 
        github.ref == 'refs/heads/main' && 
        github.event_name == 'push'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        echo "🚀 Publishing to PyPI..."
        twine upload dist/*
        echo "✅ Successfully published version ${{ steps.get_version.outputs.VERSION }} to PyPI"
    
    - name: Create and push git tag
      if: |
        steps.check_pypi.outputs.VERSION_EXISTS != 'true' && 
        github.ref == 'refs/heads/main' && 
        github.event_name == 'push'
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        echo "🏷️  Creating git tag v$VERSION..."
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "v$VERSION" -m "Release version $VERSION"
        git push origin "v$VERSION"
        echo "✅ Tag v$VERSION created and pushed"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build summary (feature branch)
      if: github.ref != 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "✅ Build successful on branch: ${{ github.ref_name }}"
        echo "📦 Version: ${{ steps.get_version.outputs.VERSION }}"
        echo "ℹ️  PyPI publishing only happens on main branch"
    
    - name: PR validation summary
      if: github.event_name == 'pull_request'
      run: |
        echo "✅ Build and validation successful for PR"
        echo "📦 Version: ${{ steps.get_version.outputs.VERSION }}"
        echo "🚀 Will be published when merged to main"
    
    - name: Version already exists
      if: steps.check_pypi.outputs.VERSION_EXISTS == 'true'
      run: |
        echo "ℹ️  Version ${{ steps.get_version.outputs.VERSION }} already exists on PyPI"
        echo "📦 Build completed successfully but skipping upload"
        echo "💡 Bump version in pyproject.toml and __version__.py to publish a new release"
