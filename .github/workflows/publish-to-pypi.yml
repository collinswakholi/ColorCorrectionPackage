name: Publish to PyPI

on:
  push:
    paths:
      - 'pyproject.toml'
      - 'ColorCorrectionPipeline/__version__.py'
    branches:
      - main
      - 'release/**'  # Supports release branches like release/v1.3.0
  pull_request:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'ColorCorrectionPipeline/__version__.py'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine hatchling
    
    - name: Extract version from pyproject.toml
      id: get_version
      run: |
        VERSION=$(grep -oP '(?<=version = ")[^"]+' pyproject.toml)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Package version: $VERSION"
    
    - name: Check if version exists on PyPI
      id: check_pypi
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        if pip index versions ColorCorrectionPipeline 2>/dev/null | grep -q "$VERSION"; then
          echo "VERSION_EXISTS=true" >> $GITHUB_OUTPUT
          echo "Version $VERSION already exists on PyPI"
        else
          echo "VERSION_EXISTS=false" >> $GITHUB_OUTPUT
          echo "Version $VERSION does not exist on PyPI, proceeding with upload"
        fi
      continue-on-error: true
    
    - name: Build package
      if: steps.check_pypi.outputs.VERSION_EXISTS != 'true'
      run: |
        python -m build
        ls -lh dist/
    
    - name: Check distribution
      if: steps.check_pypi.outputs.VERSION_EXISTS != 'true'
      run: |
        twine check dist/*
    
    - name: Publish to PyPI
      if: steps.check_pypi.outputs.VERSION_EXISTS != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'release')
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        twine upload dist/*
    
    - name: Create GitHub Release Tag
      if: steps.check_pypi.outputs.VERSION_EXISTS != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'release'
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git tag -a "v$VERSION" -m "Release version $VERSION"
        git push origin "v$VERSION"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build only (feature branch)
      if: github.ref != 'refs/heads/main' && github.event_name == 'push'
      run: |
        echo "✓ Build successful on feature branch: ${{ github.ref_name }}"
        echo "Note: PyPI publishing only happens on main branch"
    
    - name: Pull Request Check
      if: github.event_name == 'pull_request'
      run: |
        VERSION=${{ steps.get_version.outputs.VERSION }}
        echo "✓ Build and validation successful for PR"
        echo "Version: $VERSION"
        echo "This will be published when merged to main"
    
    - name: Skip publishing
      if: steps.check_pypi.outputs.VERSION_EXISTS == 'true'
      run: |
        echo "Version ${{ steps.get_version.outputs.VERSION }} already exists on PyPI. Skipping publication."
