name: Publish qualified distributions to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after qualification and protected-environment approval
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  qualification:
    uses: ./.github/workflows/qualification.yml

  publish:
    name: Publish the same qualified archives
    needs: qualification
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    # Configure required reviewers and a PyPI trusted publisher for this named
    # environment before enabling a release. The workflow never creates tags.
    environment:
      name: pypi
      url: https://pypi.org/project/ColorCorrectionPipeline/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist
      - name: Recheck the qualified archives and release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        shell: python
        run: |
          import os, subprocess, sys
          args = [sys.executable, 'scripts/verify_distribution.py']
          if os.environ['RELEASE_TAG']:
              args += ['--expected-version', os.environ['RELEASE_TAG']]
          subprocess.run(args, check=True)
      - name: Publish using PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
