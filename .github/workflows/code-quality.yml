name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11
        cache: 'pip'
    
    - name: Install dependencies
      timeout-minutes: 15
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade wheel setuptools
        # Install PyTorch CPU-only version to reduce download size
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        # Install other dependencies without PyTorch (already installed above)
        pip install -e ".[dev]" --no-deps
        pip install opencv-python opencv-contrib-python scikit-learn scipy numpy ultralytics scikit-image plotly matplotlib pandas statsmodels seaborn colour-science colour-checker-detection pytest pytest-cov black flake8 isort mypy pre-commit
    
    - name: Check code formatting with Black
      run: |
        black --check --diff .
    
    - name: Check import sorting with isort
      run: |
        isort --check-only --diff .
    
    - name: Type check with mypy
      run: |
        mypy ColorCorrectionPipeline --ignore-missing-imports --config-file=mypy.ini || echo "MyPy checks completed with warnings"