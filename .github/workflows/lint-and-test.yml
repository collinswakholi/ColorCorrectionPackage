name: Lint and tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # mypy resolves numpy/torch/OpenCV/Pillow types from the installed
      # dependencies, so install the package (CPU torch) alongside the linters.
      - name: Install linters and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . "black==26.10.1" "ruff==0.17.6" "mypy==2.4.1"
      - name: Formatting (black)
        run: black --check ColorCorrectionPipeline tests scripts
      # Full rule set from pyproject.toml (E, F, I, N, W, UP with documented ignores).
      - name: Lint (ruff)
        run: ruff check ColorCorrectionPipeline tests scripts
      # Configuration and excluded legacy modules: [tool.mypy] in pyproject.toml.
      - name: Type check (mypy)
        run: mypy ColorCorrectionPipeline

  tests:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Unit and regression tests
        run: python -m pytest tests -m "not slow" -q
      # Golden outputs were captured on Windows x64; run them where they were recorded.
      - name: Golden-output tests
        if: runner.os == 'Windows'
        run: python -m pytest tests -m slow -q
