name: Lint and tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "black==26.10.1" "ruff==0.17.6"
      - name: Formatting (black)
        run: black --check ColorCorrectionPipeline tests scripts
      # Bug-class rules only: syntax errors, undefined names, invalid comparisons and
      # statements. The wider style set in pyproject.toml is not yet clean (legacy names).
      - name: Correctness lint (ruff)
        run: ruff check ColorCorrectionPipeline tests scripts --select E9,F63,F7,F82

  tests:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Unit and regression tests
        run: python -m pytest tests -m "not slow" -q
      # Golden outputs were captured on Windows x64; run them where they were recorded.
      - name: Golden-output tests
        if: runner.os == 'Windows'
        run: python -m pytest tests -m slow -q
