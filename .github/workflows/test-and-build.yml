name: Test and Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [published]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: [3.8, 3.9, '3.10', 3.11, 3.12]
      fail-fast: false
    timeout-minutes: 60
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      timeout-minutes: 30
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade wheel setuptools
        # Install NumPy version compatible with Python 3.9
        if [[ "${{ matrix.python-version }}" == "3.9" ]]; then
          pip install "numpy<2.0"
        else
          pip install numpy
        fi
        # Install PyTorch CPU-only version to reduce download size
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        # Install other dependencies without PyTorch (already installed above)
        pip install -e ".[dev]" --no-deps
        pip install opencv-python opencv-contrib-python scikit-learn scipy ultralytics scikit-image plotly matplotlib pandas statsmodels seaborn colour-science colour-checker-detection pytest pytest-cov black flake8 isort mypy pre-commit
    
    - name: Lint with flake8
      run: |
        # Only check for critical errors (syntax issues, undefined names, etc.)
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Run full check with relaxed rules - should pass now
        flake8 . --count --show-source --statistics
    
    - name: Test with pytest
      timeout-minutes: 15
      run: |
        pytest --cov=ColorCorrectionPipeline --cov-report=xml --maxfail=5 -x
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11
        cache: 'pip'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*