[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ColorCorrectionPipeline"
# Keep this in sync with ColorCorrectionPipeline/__version__.py.
version = "2.3.0"
description = "A step-wise, color correction pipeline for digital images combining flat-field correction, gamma correction, white-balance, and color-correction"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT for source code; bundled detector models declare AGPL-3.0. See included model notices."}
license-files = ["LICENSE", "ColorCorrectionPipeline/detection/models/LICENSE-AGPL-3.0.txt", "ColorCorrectionPipeline/detection/models/UPSTREAM-NOTICE.md"]
authors = [
    {name = "Collins Wakholi"},
    {name = "Devin A. Rippner"},
]
keywords = [
    "color-correction",
    "image-processing",
    "flat-field",
    "gamma-correction",
    "white-balance",
    "computer-vision",
    "photography",
    "scientific-imaging",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.21.0",
    "opencv-contrib-python>=4.5.0",
    "onnxruntime>=1.31; python_version >= '3.11'",
    "onnxruntime>=1.16; python_version < '3.11'",
    "onnxruntime-ep-webgpu>=0.4; python_version >= '3.11' and ((sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'ARM64')) or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'darwin' and platform_machine == 'arm64'))",
    "Pillow>=9.2",
    "tifffile>=2021.11.2",
    "colour-science>=0.4.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "scikit-image>=0.19.0",
    "scipy>=1.7.0",
    "torch>=1.10.0",
    "matplotlib>=3.4.0",
    "plotly>=5.0.0",
    "seaborn>=0.11.0",
]

[project.optional-dependencies]
performance = [
    "numba>=0.55.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.1.0",
    "black>=23.0",
    "mypy>=1.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]
segmentation = [
    "colour-checker-detection>=0.1.0",
]
# Compressed TIFF codecs for tifffile (e.g. 16-bit LZW/Deflate TIFF reading).
tiff = [
    "imagecodecs>=2021.11.20",
]

[project.urls]
Homepage = "https://github.com/collinswakholi/ColorCorrectionPackage"
Repository = "https://github.com/collinswakholi/ColorCorrectionPackage"
"Bug Tracker" = "https://github.com/collinswakholi/ColorCorrectionPackage/issues"
Documentation = "https://github.com/collinswakholi/ColorCorrectionPackage"

[tool.hatch.build.targets.wheel]
packages = ["ColorCorrectionPipeline"]

# Keep source photographs in one place while making tutorials usable from a wheel.
[tool.hatch.build.targets.wheel.force-include]
"Images/Image_1.JPG" = "ColorCorrectionPipeline/examples/data/Image_1.JPG"
"Images/white.JPG" = "ColorCorrectionPipeline/examples/data/white.JPG"
"Images/Sample_1.JPG" = "ColorCorrectionPipeline/examples/data/Sample_1.JPG"

[tool.hatch.build.targets.sdist]
exclude = [".github/**", "uv.lock", "tests/**"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",
    # printf-style formatting is used deliberately in error messages; rewriting
    # 80+ call sites to f-strings has no correctness benefit.
    "UP031",
    # requires-python is 3.8: keep typing.Optional/List/Dict so annotations stay
    # evaluable by typing.get_type_hints on 3.8/3.9 even under
    # `from __future__ import annotations`.
    "UP006",
    "UP007",
    "UP045",
    # The distribution and import name ColorCorrectionPipeline is public.
    "N999",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
# Legacy naming kept for API compatibility: public functions, classes and keyword
# arguments with capitalised names (convert_to_LCHab, metrics, Image=, RGB=, ...),
# and colour-science/matrix notation for locals (X, M, RGB, Lab, Z_flat).
"ColorCorrectionPipeline/key_functions.py" = ["N801", "N802", "N803", "N806"]
"ColorCorrectionPipeline/core/*.py" = ["N801", "N802", "N803", "N806"]
"ColorCorrectionPipeline/flat_field/*.py" = ["N802", "N803", "N806"]
"ColorCorrectionPipeline/pipeline.py" = ["N803", "N806", "I001"]
"ColorCorrectionPipeline/config.py" = ["N803", "I001"]
"ColorCorrectionPipeline/conventional.py" = ["N803"]
"ColorCorrectionPipeline/fitting.py" = ["N803", "N806", "I001"]
"ColorCorrectionPipeline/evaluation.py" = ["N803", "N806"]
"ColorCorrectionPipeline/portable_inference.py" = ["N803"]
"ColorCorrectionPipeline/stage_policies.py" = ["N803"]
"ColorCorrectionPipeline/ui_fitting.py" = ["N803", "N806", "I001"]
"tests/test_custom_nn_determinism.py" = ["N806"]
# Import sorting is not applied where it would reorder third-party or package
# imports (import side effects: torch/cv2/onnxruntime DLL load order, lazy
# colour-science loading, circular package imports). Files under concurrent
# change elsewhere are also left alone. (config, fitting, pipeline and ui_fitting
# carry I001 in their entries above.)
"ColorCorrectionPipeline/acceleration.py" = ["I001"]
"ColorCorrectionPipeline/bundle.py" = ["I001"]
"ColorCorrectionPipeline/contracts.py" = ["I001"]
"ColorCorrectionPipeline/core/accel.py" = ["I001"]
"ColorCorrectionPipeline/core/color_spaces.py" = ["I001"]
"ColorCorrectionPipeline/core/correction.py" = ["I001"]
"ColorCorrectionPipeline/core/execution.py" = ["I001"]
"ColorCorrectionPipeline/core/lut_cache.py" = ["I001"]
"ColorCorrectionPipeline/core/metrics.py" = ["I001"]
"ColorCorrectionPipeline/core/utils.py" = ["I001"]
"ColorCorrectionPipeline/io/__init__.py" = ["I001"]
"ColorCorrectionPipeline/io/image_data.py" = ["I001"]
"ColorCorrectionPipeline/io/writers.py" = ["I001"]
"ColorCorrectionPipeline/models.py" = ["I001"]
"ColorCorrectionPipeline/modern.py" = ["I001"]
"ColorCorrectionPipeline/observations.py" = ["I001"]
"ColorCorrectionPipeline/prediction.py" = ["I001"]
# ui_execution binds ui_native matrix constants to local role names.
"ColorCorrectionPipeline/ui_execution.py" = ["I001", "N811"]
"ColorCorrectionPipeline/ui_native.py" = ["I001"]
"scripts/verify_installed.py" = ["I001"]
"scripts/verify_v2.py" = ["I001"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.mypy]
# mypy 2.x accepts 3.10 as its oldest target. requires-python is 3.8; 3.8/3.9
# compatibility is covered by ruff/black's py38 target and the CI test matrix.
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# Third-party packages without type information (no stubs are installed in CI).
[[tool.mypy.overrides]]
module = [
    "colour.*",
    "colour_checker_detection.*",
    "cv2.*",
    "numba.*",
    "onnxruntime.*",
    "pandas.*",
    "psutil.*",
    "scipy.*",
    "seaborn.*",
    "skimage.*",
    "sklearn.*",
    "statsmodels.*",
    "threadpoolctl.*",
    "tifffile.*",
    "torchsummary.*",
]
ignore_missing_imports = true

# Large legacy modules that are not yet type-clean are excluded from the gate;
# everything else must pass `mypy ColorCorrectionPipeline`. Remove a module from
# this list once it checks clean.
[[tool.mypy.overrides]]
module = [
    "ColorCorrectionPipeline._image_numeric",
    "ColorCorrectionPipeline.acceleration",
    "ColorCorrectionPipeline.batch",
    "ColorCorrectionPipeline.bundle",
    "ColorCorrectionPipeline.contracts",
    "ColorCorrectionPipeline.core.accel",
    "ColorCorrectionPipeline.core.color_spaces",
    "ColorCorrectionPipeline.core.correction",
    "ColorCorrectionPipeline.core.transforms",
    "ColorCorrectionPipeline.core.utils",
    "ColorCorrectionPipeline.detection.charts",
    "ColorCorrectionPipeline.examples.customizable",
    "ColorCorrectionPipeline.fitting",
    "ColorCorrectionPipeline.flat_field.correction",
    "ColorCorrectionPipeline.key_functions",
    "ColorCorrectionPipeline.models",
    "ColorCorrectionPipeline.pipeline",
    "ColorCorrectionPipeline.prediction",
    "ColorCorrectionPipeline.ui_fitting",
]
ignore_errors = true
