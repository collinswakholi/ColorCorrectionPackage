[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ColorCorrectionPipeline"
# Keep this in sync with ColorCorrectionPipeline/__version__.py.
version = "1.5.0"
description = "A step-wise, color correction pipeline for digital images combining flat-field correction, gamma correction, white-balance, and color-correction"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT for source code; bundled detector models declare AGPL-3.0. See included model notices."}
license-files = ["LICENSE", "ColorCorrectionPipeline/detection/models/LICENSE-AGPL-3.0.txt", "ColorCorrectionPipeline/detection/models/UPSTREAM-NOTICE.md"]
authors = [
    {name = "Collins Wakholi"},
    {name = "Devin A. Rippner"},
]
keywords = [
    "color-correction",
    "image-processing",
    "flat-field",
    "gamma-correction",
    "white-balance",
    "computer-vision",
    "photography",
    "scientific-imaging",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.21.0",
    "opencv-contrib-python>=4.5.0",
    "onnxruntime>=1.31; python_version >= '3.11'",
    "onnxruntime>=1.16; python_version < '3.11'",
    "onnxruntime-ep-webgpu>=0.4; python_version >= '3.11' and ((sys_platform == 'win32' and (platform_machine == 'AMD64' or platform_machine == 'ARM64')) or (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'darwin' and platform_machine == 'arm64'))",
    "Pillow>=9.2",
    "tifffile>=2021.11.2",
    "colour-science>=0.4.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "scikit-image>=0.19.0",
    "scipy>=1.7.0",
    "torch>=1.10.0",
    "matplotlib>=3.4.0",
    "plotly>=5.0.0",
    "seaborn>=0.11.0",
]

[project.optional-dependencies]
performance = [
    "numba>=0.55.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.1.0",
    "black>=23.0",
    "mypy>=1.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]
segmentation = [
    "colour-checker-detection>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/collinswakholi/ColorCorrectionPackage"
Repository = "https://github.com/collinswakholi/ColorCorrectionPackage"
"Bug Tracker" = "https://github.com/collinswakholi/ColorCorrectionPackage/issues"
Documentation = "https://github.com/collinswakholi/ColorCorrectionPackage"

[tool.hatch.build.targets.wheel]
packages = ["ColorCorrectionPipeline"]

# Training checkpoints are not loaded by the package. Ship the two inference
# ONNX assets with their pinned notices, without the unused pickle-based .pt.
exclude = ["ColorCorrectionPipeline/flat_field/models/*.pt"]

[tool.hatch.build.targets.sdist]
exclude = ["ColorCorrectionPipeline/flat_field/models/*.pt", ".github/**", "uv.lock"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "colour.*",
    "cv2.*",
    "plotly.*",
    "seaborn.*",
]
ignore_missing_imports = true
